<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PREGA.CUT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #08090d;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 20px;
        }

        p {
            color: #999;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            padding: 14px 25px;
            border: 0;
            border-radius: 10px;
            background: #ffffff;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>PREGA.CUT</h1>

        <p>O sistema está funcionando.</p>

        <button onclick="testar()">TESTAR JAVASCRIPT</button>
    </div>

    <script>
        function testar() {
            alert("JavaScript funcionando!");
        }
    </script>

</body>
</html>
